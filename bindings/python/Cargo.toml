# The Python binding. Its own crate and its own workspace, so the library's
# dependency graph never gains pyo3, and a Rust user of panchat compiles nothing
# of Python's.
[package]
name = "panchat-python"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
name = "_panchat"
crate-type = ["cdylib"]

[dependencies]
# The zip feature on, as for the CLI: someone who installed a package to read
# their export should not have to unpack it first.
panchat = { path = "../..", features = ["zip"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"

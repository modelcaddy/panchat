[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "panchat"
description = "Read AI chat exports from any vendor into one representation, with the losses named."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["chatgpt", "claude", "gemini", "export", "conversation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://modelcaddy.github.io/panchat/"
Repository = "https://github.com/modelcaddy/panchat"
Specification = "https://github.com/modelcaddy/panchat/blob/main/SPEC.md"

[tool.maturin]
python-source = "python"
module-name = "panchat._panchat"
features = ["pyo3/extension-module"]

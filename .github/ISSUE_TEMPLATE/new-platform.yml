name: Support a new platform
description: A product whose export this cannot read yet — whether or not you plan to write the adapter.
labels: ["adapter"]
body:
  - type: markdown
    attributes:
      value: |
        Two vendors is a tool; enough vendors is infrastructure. Open this even if you are not
        going to write the code — knowing a shape exists is most of the work.

        **Do not attach your export.** Describe the layout instead; see
        [CONTRIBUTING.md](../../CONTRIBUTING.md) for how to build a synthetic fixture.
  - type: input
    id: platform
    attributes:
      label: Product
      placeholder: Gemini, Open WebUI, LM Studio, …
    validations:
      required: true
  - type: dropdown
    id: origin
    attributes:
      label: Where the data comes from
      options:
        - An official data export
        - A local database or config directory
        - Something else
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: What the export looks like
      description: "Filenames and sizes (`unzip -l`, `ls -la`), and the key names of the structure — not their values."
      render: text
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What the format can express
      description: |
        The answers that decide how much of it survives. Unknown is a fine answer.
        - Are regenerated or edited turns kept, or only the final thread?
        - Is the model recorded per message?
        - Do attachment bytes ship, or only references?
        - Are there side-cars — projects, folders, memories, custom instructions?
  - type: dropdown
    id: helping
    attributes:
      label: Are you up for writing it?
      options:
        - I would like to write the adapter
        - I can build a synthetic fixture and test patches
        - I am reporting it so someone else can
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have not attached my export or pasted conversation content into this issue.
          required: true

name: A vendor changed its export
description: Your export no longer reads, or reads wrongly. This is the most useful report you can file.
labels: ["format-drift"]
body:
  - type: markdown
    attributes:
      value: |
        No vendor announces a change to its export, so this report is how we find out.

        **Do not attach your export.** It contains everything you have ever typed into that
        product. Everything below is either machine output or a description — nothing here asks
        for your conversations.
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: ChatGPT, Claude, Gemini, …
    validations:
      required: true
  - type: input
    id: exported
    attributes:
      label: When you requested the export
      description: Roughly is fine. Shapes are dated, so this pins which one you have.
      placeholder: 2026-08-20
    validations:
      required: true
  - type: textarea
    id: inspect
    attributes:
      label: Output of `--inspect`
      description: "`panchat <your-export> --inspect`. It prints the detected shape and counts, not your content."
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What looked wrong
      description: Wrong counts, a missing section, an error, conversations that came through empty.
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: File layout of the export
      description: "Filenames and sizes only — e.g. `ls -la` or `unzip -l`. No file contents."
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have not attached my export or pasted conversation content into this issue.
          required: true
